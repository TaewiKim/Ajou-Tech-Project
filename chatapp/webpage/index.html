<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <button class="new-chat-btn" id="newChatBtn" title="새 대화 시작">＋ 새 대화</button>
      </div>
      <div class="sidebar-body">
        <div class="conv-list" id="convList"></div>
      </div>
      <div class="sidebar-footer">
        <div class="user-card" id="userCard">
          <div class="user-initial" id="userInitial">?</div>
          <div class="user-meta">
            <div class="user-name" id="userName">로그인 필요</div>
            <div class="user-email" id="userEmail"></div>
          </div>
        </div>
        <div class="auth-actions">
          <button class="auth-btn" id="loginBtn">로그인</button>
          <button class="auth-btn outline" id="logoutBtn" style="display:none;">로그아웃</button>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="brand">
          <button class="ghost" id="sidebarToggle" title="대화 목록 열기">☰</button>

          <!-- OpenAI 아이콘 (인라인 SVG, 흰색) -->
          <svg width="22" height="22" viewBox="0 0 16 16" aria-hidden="true">

          </svg>

          <span>ChatGPT Clone</span>
        </div>
        <div class="topbar-actions">
          <button class="ghost" id="clearAllBtn" title="모든 대화 삭제">모두 삭제</button>
        </div>
      </header>

      <section class="chat" id="chat">
        <div class="messages" id="messages"></div>
      </section>

      <footer class="composer">
        <form id="composerForm">
          <div class="composer-row">
            <textarea id="promptInput" placeholder="메시지를 입력하세요... (Shift+Enter 줄바꿈)" rows="1"></textarea>
            <div class="composer-actions">
              <button type="button" id="stopBtn" class="ghost" disabled>중지</button>
              <button type="submit" id="sendBtn" class="primary">전송</button>
            </div>
          </div>
          <div class="hint">
            로그인 후 사용하세요. <strong>대화 이력은 서버(DynamoDB)</strong>에 저장됩니다.
          </div>
        </form>
      </footer>
    </main>
  </div>

  <template id="msgTemplate">
    <div class="msg">
      <div class="avatar">A</div>
      <div class="bubble"></div>
    </div>
  </template>

  <script src="./auth.js"></script>
  <script src="./api.js"></script>
  <script src="./app.js"></script>
</body>
</html>
